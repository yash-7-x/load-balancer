worker_processes  1;

events {
    worker_connections  1024;
}

http {

    # Define a group of backend servers.
    upstream backend_servers {

        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }
    # Configure the reverse proxy.
    server {

        # NGINX listens for incoming requests on port 8080.
        listen 8080;

        # Accept requests for localhost.
        server_name localhost;

        location / {

            # Forward requests to the backend group.
            proxy_pass http://backend_servers;

            # Forward the original host information.
            proxy_set_header Host $host;

            # Forward the client's IP address.
            proxy_set_header X-Real-IP $remote_addr;

            # Preserve the forwarded client IP chain.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Forward the original request protocol.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry another backend on certain upstream failures.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}